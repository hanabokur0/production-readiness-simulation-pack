$schema: https://json-schema.org/draft/2020-12/schema
$id: https://example.org/prsp/scenario.schema.yaml
title: PRSP Scenario
type: object
required: [id, domain, title, severity, checks]
properties:
  id: {type: string, pattern: '^[A-Z]+-[0-9]{3}$'}
  domain: {type: string}
  title: {type: string}
  purpose: {type: string}
  severity: {enum: [low, medium, high, critical]}
  applies_when:
    type: object
    required: [path, operator]
    properties:
      path: {type: string}
      operator: {enum: [equals, not_equals, truthy, falsy, exists, gte, lte]}
      value: {}
  checks:
    type: array
    minItems: 1
    items:
      type: object
      required: [path, operator, on_fail]
      properties:
        path: {type: string}
        operator: {enum: [equals, not_equals, truthy, falsy, exists, gte, lte]}
        value: {}
        on_fail: {enum: [REVIEW, HOLD, REJECT]}
        reason: {type: string}
  evidence_required:
    type: array
    items: {type: string}
  tags:
    type: array
    items: {type: string}
additionalProperties: true
